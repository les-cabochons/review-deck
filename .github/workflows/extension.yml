# Checks every push and PR; on main, also publishes the Azure DevOps extension privately and
# shares it with the test organization. Needs the MARKETPLACE_TOKEN repository secret (a Marketplace
# personal access token with Marketplace > Manage on "All accessible organizations").
name: Extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PUBLISHER: Cabochonio
  SHARE_WITH: cabochons

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run ext:typecheck
      - run: npm run ext:test
      - run: npm run backend:typecheck
      - run: npm run ext:build

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One publish at a time; the Marketplace rejects out-of-order versions.
    concurrency: marketplace-publish
    env:
      MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Repository variable from `terraform -chdir=infra output backend_url`; unset = structural grouping only.
      - run: npm run ext:build
        env:
          SEMANTIC_PR_BACKEND_URL: ${{ vars.SEMANTIC_PR_BACKEND_URL }}
      # The Marketplace needs a new version per upload: major.minor from the manifest, patch = run number.
      - name: Version
        id: version
        run: |
          base=$(node -p "require('./extension/vss-extension.json').version.split('.').slice(0, 2).join('.')")
          echo "version=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Package
        run: >
          npx tfx extension create --root extension --manifest-globs vss-extension.json
          --override '{"version": "${{ steps.version.outputs.version }}"}'
          --output-path extension/
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ steps.version.outputs.version }}
          path: extension/*.vsix
      # Upload without waiting: Marketplace validation sometimes takes longer than tfx's built-in ~4 minute wait.
      - name: Publish
        if: env.MARKETPLACE_TOKEN != ''
        run: >
          npx tfx extension publish --vsix extension/${{ env.PUBLISHER }}.semantic-pr-review-${{ steps.version.outputs.version }}.vsix
          --token "$MARKETPLACE_TOKEN" --no-wait-validation --no-prompt
      - name: Wait for Marketplace validation
        if: env.MARKETPLACE_TOKEN != ''
        timeout-minutes: 25
        run: |
          for attempt in $(seq 1 80); do
            status=$(npx tfx extension isvalid --publisher "$PUBLISHER" --extension-id semantic-pr-review               --version "${{ steps.version.outputs.version }}" --token "$MARKETPLACE_TOKEN" --json --no-prompt               | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s.slice(s.indexOf("{")));console.log(j.status+" "+(j.message??""))}catch{console.log("unknown "+s.trim())}})')
            echo "validation: $status"
            case "$status" in
              success*) exit 0 ;;
              error*) echo "::error::Marketplace validation failed: $status"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Marketplace validation didn't finish in 20 minutes"; exit 1
      # Sharing persists across versions; repeating it is harmless and covers a first publish.
      - name: Share with ${{ env.SHARE_WITH }}
        if: env.MARKETPLACE_TOKEN != ''
        run: >
          npx tfx extension share --publisher "$PUBLISHER" --extension-id semantic-pr-review
          --share-with ${{ env.SHARE_WITH }} --token "$MARKETPLACE_TOKEN" --no-prompt
      - name: Token missing
        if: env.MARKETPLACE_TOKEN == ''
        run: echo "::warning::MARKETPLACE_TOKEN secret is not set; packaged ${{ steps.version.outputs.version }} as an artifact but did not publish."
