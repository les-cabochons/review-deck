<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Semantic PR Review settings</title>
    <style>
      body { margin: 0; color: var(--text-primary-color, #242424); background: var(--background-color, #fff); font: 14px "Segoe UI", sans-serif; }
      .startup-message { margin: 32px; max-width: 640px; }
      .startup-message h1 { font-size: 22px; }
      .startup-message a { color: var(--communication-foreground, #0078d4); }
      .startup-message button { font: inherit; padding: 6px 12px; }
    </style>
    <link rel="stylesheet" href="review.css" />
  </head>
  <body data-page="settings">
    <div id="root"><p class="startup-message" role="status">Opening settings…</p></div>
    <script type="module" src="review.js"></script>
  </body>
</html>
